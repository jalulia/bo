<!doctype html><html><body style="margin:0;background:#8aa86a"><canvas id="c"></canvas>
<script src="../src/raster.js"></script><script src="../src/rex.js"></script><script src="../src/cat.js"></script>
<script>
// Juno's pose sheet: resting, looking at you, alert at a bird, chin down, asleep, petted, facing you from the bed
const q = new URLSearchParams(location.search), PX = +(q.get('px') || 3);
const cv = document.getElementById('c'); cv.width = 560; cv.height = 240; cv.style.width = cv.width * PX + 'px'; cv.style.imageRendering = 'pixelated';
const g = cv.getContext('2d'); g.fillStyle = '#7f9c5e'; g.fillRect(0, 0, 560, 240);
const fake = { size: 1.2, frame: 0, pointer: { x: 0, y: 0 } };
const set = [
  ['sphinx', Math.PI - 0.38, (d) => {}],
  ['sphinx', Math.PI - 0.38, (d) => { d.look = [d.x - 40, d.y + 120]; }],
  ['sphinx', 0.35, (d) => { d.look = [d.x - 30, d.y - 120]; d.browT = 999; d.browTo = 0.9; d.earT = 999; d.earTo = 0.95; }],
  ['sphinx', Math.PI / 2 + 0.25, (d) => { d.look = [d.x - 10, d.y + 100]; }],
  ['chin', 0.35, (d) => {}],
  ['sleep', 0.35, (d) => {}],
  ['sphinx', 0.35, (d) => { d.pet('head', d.x + 20, d.y - 40); d.wag = 999; }],
  ['sphinx', 0.35, (d) => { d.look = [d.x + 160, d.y - 30]; d.earT = 999; d.earTo = -0.45; d.lidT = 999; d.lidTo = 0.5; }],
];
set.forEach(([a, th, fn], i) => { const d = new BZ.Dog(fake, 70 + (i % 4) * 140, 95 + Math.floor(i / 4) * 110); d.anim = a; d.theta = th; fn(d); for (let k = 0; k < 60; k++) d.animate(); d.draw(g); });
</script></body></html>
