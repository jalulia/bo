<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3a3030">
<title>Desktop Bo</title>
<style>
  /* the page is a pretend desk: the habitat window sits on it, the toy box beside it (or, on a phone, as a sheet at the bottom) */
  :root { --desk: #7c968f; --desk2: #5f7873; --winbar: #3a3030; --winpaper: #f4eee4; --dock: 348px; --gap: 20px; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--desk); font: 13px/1.3 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; overscroll-behavior: none; }
  #desk { position: fixed; inset: 0; background: radial-gradient(1000px 700px at 15% 10%, #a7beb3 0%, transparent 60%), radial-gradient(900px 700px at 85% 95%, #c9a77c 0%, transparent 55%), linear-gradient(160deg, var(--desk), var(--desk2)); touch-action: none; }
  #hab { position: absolute; z-index: 1; left: var(--gap); top: calc(var(--gap) + var(--sat)); right: calc(var(--dock) + var(--gap) * 2); bottom: calc(var(--gap) + var(--sab)); background: var(--winpaper); border: 2px solid var(--winbar); border-radius: 14px; box-shadow: 0 2px 0 var(--winbar), 0 24px 60px rgba(0,0,0,.3); overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
  #hab .bar { height: 34px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: var(--winbar); color: #f2ebdc; }
  #hab .bar i { width: 11px; height: 11px; border-radius: 50%; display: block; background: #e2675b; } #hab .bar i:nth-child(2) { background: #e9b949; } #hab .bar i:nth-child(3) { background: #69b765; margin-right: 6px; }
  #hab .bar b { font: 400 13px/1 'BoPixel', ui-monospace, monospace; letter-spacing: .03em; flex: 1; }
  #hab .stage { flex: 1; }
  #hab[hidden] { display: none; }
  canvas#c { position: fixed; left: 0; top: 0; image-rendering: pixelated; z-index: 2; pointer-events: none; }
  canvas#o { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  #dock { position: fixed; z-index: 4; right: var(--gap); top: calc(var(--gap) + var(--sat)); width: var(--dock); max-height: calc(100% - var(--gap) * 2 - var(--sat) - var(--sab)); overflow: auto; overscroll-behavior: contain; border-radius: 14px; scrollbar-width: thin; }
  #sheetbar { display: none; }
  /* phones and small tablets: the window fills the top, the toy box is a sheet you pull up from the bottom */
  @media (max-width: 820px), (max-height: 560px) {
    :root { --gap: 10px; }
    #hab { left: 0; right: 0; top: var(--sat); bottom: calc(68px + var(--sab)); border-radius: 0; border-width: 0 0 2px; box-shadow: none; }
    #hab .bar { padding-top: 0; }
    #dock { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: none; height: calc(68px + var(--sab)); border-radius: 16px 16px 0 0; background: #f4eee4; border-top: 2px solid #3a3030; box-shadow: 0 -8px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; transition: height .22s ease; }
    #dock.open { height: min(82%, calc(100% - 120px)); }
    #dock .bo-panel { max-width: none; border: 0; border-radius: 0; box-shadow: none; overflow: auto; flex: 1; min-height: 0; padding-bottom: var(--sab); }
    #dock .bo-panel .bo-head { display: none; }
    #sheetbar { display: flex; flex: none; align-items: center; gap: 10px; height: 66px; padding: 0 14px 0 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #sheetbar canvas { width: 44px; height: 44px; border-radius: 9px; border: 2px solid #3a3030; background: #c9d3c4; image-rendering: pixelated; flex: none; }
    #sheetbar .t { flex: 1; min-width: 0; line-height: 1.2; }
    #sheetbar .t b { font: 400 15px 'BoPixel', ui-monospace, monospace; display: block; }
    #sheetbar .t span { color: #7d6f66; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    #sheetbar .t span.hand { color: #3a3030; }
    #sheetbar .grip { width: 36px; height: 4px; border-radius: 2px; background: #d8ccba; position: absolute; left: 50%; top: 6px; transform: translateX(-50%); }
    #sheetbar .btn { flex: none; height: 32px; padding: 0 12px; border-radius: 9px; border: 2px solid #3a3030; background: #3a3030; color: #f4eee4; font: 600 12px ui-rounded, system-ui, sans-serif; }
    #dock.open #sheetbar .btn { background: transparent; color: #3a3030; }
    #desk .fake { display: none; }
  }
  /* a tablet held upright: the window takes the top, the toy box is open underneath */
  @media (min-width: 600px) and (max-width: 820px) and (max-aspect-ratio: 4/5) {
    #hab { bottom: auto; height: calc(100vw * 0.78 + 36px); }
    #dock { top: calc(100vw * 0.78 + 36px + var(--sat)); height: auto !important; border-radius: 0; border-top: 0; box-shadow: none; background: transparent; }
    #dock .bo-panel { background: #f4eee4; }
    #dock .bo-panel .bo-head { display: grid; }
    #sheetbar { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #dock { transition: none; } }
</style>
</head>
<body>
<div id="desk"></div>
<div id="hab"><div class="bar"><i></i><i></i><i></i><b>Bo's Jungle</b></div><div class="stage" id="stage"></div></div>
<canvas id="c"></canvas><canvas id="o"></canvas>
<div id="dock"><div id="sheetbar" data-ui><div class="grip"></div><canvas width="44" height="44"></canvas><div class="t"><b>Bo</b><span>indifferent</span></div><button class="btn">Toy box</button></div></div>
<!--ENGINE-->
<script src="../src/font-data.js"></script>
<script src="../src/raster.js"></script>
<script src="../src/rex.js"></script>
<script src="../src/cat.js"></script>
<script src="../src/items.js"></script>
<script src="../src/sound.js"></script>
<script src="../src/world.js"></script>
<script src="../src/jungle.js"></script>
<script src="../src/panel.js"></script>
<!--/ENGINE-->
<script>
  const world = new BZ.World(document.getElementById('c'), document.getElementById('o'), {});
  const hab = document.getElementById('hab'), stageEl = document.getElementById('stage'), dock = document.getElementById('dock'), bar = document.getElementById('sheetbar');
  const small = () => matchMedia('(max-width: 820px), (max-height: 560px)').matches, sheet = () => small() && !matchMedia('(min-width: 600px) and (max-aspect-ratio: 4/5)').matches;
  function setMode(m) {
    hab.hidden = m !== 'habitat';
    world.setHabitat(m === 'habitat', m === 'habitat' ? () => { const r = stageEl.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, minW: small() ? Math.max(r.width, Math.min(900, r.height * 1.6)) : 0 }; } : null); // a phone shows part of the room and follows the cats
  }
  setMode('habitat');
  let saved = null; try { saved = JSON.parse(localStorage.getItem('desktop-bo-v2') || 'null'); } catch (e) {}
  if (small() && !(saved && saved.size)) world.size = 0.95; // a little smaller on a phone
  world.load(saved);
  world.host.save = (d) => { try { localStorage.setItem('desktop-bo-v2', JSON.stringify(d)); } catch (e) {} };
  const panel = BZ.Panel(dock, {
    get: () => world.summary(), modes: true,
    cmd: (n, a) => { if (n === 'mode') setMode(a); else world.cmd(n, a); },
    onPlace: () => { if (sheet()) openSheet(false); }, // picked a thing on a phone: drop the sheet so the window is clear
  });
  // the bottom sheet (phones)
  function openSheet(on) { dock.classList.toggle('open', on); bar.querySelector('.btn').textContent = on ? 'Done' : 'Toy box'; }
  bar.addEventListener('click', () => openSheet(!dock.classList.contains('open')));
  let lastP = '';
  world.host.onChange = () => {
    panel.refresh();
    const s = world.summary(), c = s.cats[0]; if (!c) return;
    const held = s.carrying || s.tool, t = bar.querySelector('.t');
    t.querySelector('b').textContent = c.name; const sp = t.querySelector('span');
    sp.textContent = held ? BZ.ITEMS[held].label + ' in hand' : c.mood; sp.classList.toggle('hand', !!held);
    const pk = c.coat + (/asleep|settling/.test(c.mood) ? 'z' : ''); if (pk !== lastP) { lastP = pk; BZ.portrait(bar.querySelector('canvas'), c.coat, { lid: pk.endsWith('z') ? 1 : null, scale: 1.1, headY: 0.62 }); }
  };
  world.host.onChange();
  addEventListener('resize', () => { if (!small()) openSheet(false); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) world.save(); });
  addEventListener('pagehide', () => world.save());
</script>
</body>
</html>
