  /* layout: a pretend desktop; Bo's Jungle window (or the whole desk) on the left, the toy box docked right */
  :root { --desk: #7c968f; --desk2: #5f7873; --winbar: #3a3030; --winpaper: #f4eee4; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--desk); font: 13px/1.3 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  #desk { position: fixed; inset: 0; background: radial-gradient(1000px 700px at 15% 10%, #a7beb3 0%, transparent 60%), radial-gradient(900px 700px at 85% 95%, #c9a77c 0%, transparent 55%), linear-gradient(160deg, var(--desk), var(--desk2)); }
  .fake { position: absolute; background: #fbf8f2; border-radius: 9px; box-shadow: 0 14px 40px rgba(0,0,0,.2); }
  .fake::before { content: ''; display: block; height: 22px; background: #ece6dc; border-radius: 9px 9px 0 0; }
  #hab { position: absolute; z-index: 1; left: 24px; top: 24px; right: 392px; bottom: 24px; background: var(--winpaper); border: 2px solid var(--winbar); border-radius: 14px; box-shadow: 0 2px 0 var(--winbar), 0 24px 60px rgba(0,0,0,.3); overflow: hidden; display: flex; flex-direction: column; }
  #hab .bar { height: 34px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: var(--winbar); color: #f2ebdc; }
  #hab .bar i { width: 11px; height: 11px; border-radius: 50%; display: block; background: #e2675b; } #hab .bar i:nth-child(2) { background: #e9b949; } #hab .bar i:nth-child(3) { background: #69b765; margin-right: 6px; }
  #hab .bar b { font: 400 13px/1 'BoPixel', ui-monospace, monospace; letter-spacing: .03em; }
  #hab .stage { flex: 1; }
  #hab[hidden] { display: none; }
  canvas#c { position: fixed; left: 0; top: 0; image-rendering: pixelated; z-index: 2; pointer-events: none; }
  canvas#o { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  #dock { position: fixed; z-index: 4; right: 24px; top: 24px; width: 340px; max-height: calc(100% - 48px); overflow: auto; border-radius: 14px; }
  @media (max-width: 820px) {
    #hab { right: 16px; left: 16px; top: 16px; bottom: 50%; }
    #dock { left: 16px; right: 16px; top: auto; bottom: 16px; width: auto; max-height: 48%; }
    #dock .bo-panel { max-width: none; }

// ─── Ballz raster ──────────────────────────────────────────────────────────
// Flat-filled circles drawn a row at a time, with fuzz (ragged row starts),
// speckles (one stray pixel per upper-half row, mirrored ramp shade) and
// partial outlines. Tapered "linez" are scanline-filled to match.
// See docs/ballz-technique.json for provenance of each rule.
var BZ = window.BZ || (window.BZ = {});

BZ.rng = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

// circle lookup, one entry per diameter (read_out: InitCircleLookup)
const CIRCLES = [];
BZ.circle = function (d) {
  d = Math.max(1, Math.min(200, Math.round(d)));
  let c = CIRCLES[d];
  if (c) return c;
  const r = BZ.rng(d * 7919 + 13);
  c = { d, w: [], start: [], spot: [], fuzz: [] };
  for (let i = 0; i < d; i++) {
    const k = d - 2 * i - 1; // row centre (ours: symmetric top/bottom)
    const w = Math.max(0, Math.round(Math.sqrt(Math.max(0, d * d - k * k))));
    c.w.push(w);
    c.start.push(Math.floor((d - w) / 2));
    c.spot.push(Math.floor(r() * (w + 1)));
  }
  for (let L = 0; L < 8; L++) {
    const row = [];
    for (let i = 0; i < d; i++) row.push(L === 0 ? 0 : Math.floor(r() * (L + 1)) - (L >> 1));
    c.fuzz.push(row);
  }
  CIRCLES[d] = c;
  return c;
};

// Ball modes: -1 none, 0 half outline (leftmost px), >0 outline N px thick
BZ.drawBall = function (ctx, cx, cy, d, color, outline, speckle, mode, fuzz, dense) {
  d = Math.round(d);
  if (d < 1) return;
  const c = BZ.circle(d);
  const fz = c.fuzz[Math.max(0, Math.min(7, fuzz | 0))];
  const x0 = Math.round(cx - d / 2), y0 = Math.round(cy - d / 2);
  if (color) {
    ctx.fillStyle = color;
    for (let i = 0; i < d; i++) {
      const w = c.w[i]; if (!w) continue;
      ctx.fillRect(x0 + c.start[i] + fz[i], y0 + i, w, 1);
    }
  }
  if (mode > 0 && outline) {
    ctx.fillStyle = outline;
    for (let i = 0; i < d; i++) {
      const w = c.w[i]; if (!w) continue;
      const sx = x0 + c.start[i] + fz[i];
      if (i < mode || i >= d - mode) ctx.fillRect(sx, y0 + i, w, 1);
      else { ctx.fillRect(sx, y0 + i, mode, 1); ctx.fillRect(sx + w - mode, y0 + i, mode, 1); }
    }
    return;
  }
  if (mode === 0 && outline) {
    ctx.fillStyle = outline;
    for (let i = 0; i < d; i++) if (c.w[i]) ctx.fillRect(x0 + c.start[i] + fz[i], y0 + i, 1, 1);
  }
  if (speckle && dense === 'wave') { // rex curls (ours): staggered dash rows
    ctx.fillStyle = speckle;
    for (let i = 1; i < d - 1; i += 3) {
      const w = c.w[i]; if (w < 4) continue;
      const sx = x0 + c.start[i] + fz[i], ph = ((i / 3) | 0) % 2 ? 2 : 0;
      for (let x = sx + 1 + ph; x < sx + w - 2; x += 4) ctx.fillRect(x, y0 + i, 2, 1);
    }
    return;
  }
  if (speckle) {
    ctx.fillStyle = speckle;
    // read_out: upper-half rows only. dense (ours, rex curls): every row, two spots
    const rows = dense ? d - 1 : d / 2;
    for (let i = 0; i < rows; i++) {
      const w = c.w[i]; if (w < 3) continue;
      const sx = x0 + c.start[i] + fz[i];
      ctx.fillRect(sx + Math.min(w - 1, c.spot[i]), y0 + i, 1, 1);
      if (dense && w > 5) ctx.fillRect(sx + ((c.spot[i] + (w >> 1) + (i & 1) * 2) % (w - 1)), y0 + i, 1, 1);
    }
  }
};

// Row span of a drawn ball at screen row y (for clipping spots, irises, lids)
BZ.ballSpan = function (cx, cy, d, fuzz, y) {
  d = Math.round(d);
  const c = BZ.circle(d);
  const x0 = Math.round(cx - d / 2), y0 = Math.round(cy - d / 2);
  const i = y - y0;
  if (i < 0 || i >= d || !c.w[i]) return null;
  const sx = x0 + c.start[i] + c.fuzz[Math.max(0, Math.min(7, fuzz | 0))][i];
  return [sx, sx + c.w[i]];
};

// A filled circle clipped to a parent ball (paint spots, irises)
BZ.drawClipped = function (ctx, cx, cy, d, color, parent, fuzz) {
  d = Math.round(d); if (d < 1) return;
  const c = BZ.circle(d);
  const fz = c.fuzz[Math.max(0, Math.min(7, fuzz | 0))];
  const x0 = Math.round(cx - d / 2), y0 = Math.round(cy - d / 2);
  ctx.fillStyle = color;
  for (let i = 0; i < d; i++) {
    const w = c.w[i]; if (!w) continue;
    let a = x0 + c.start[i] + fz[i], b = a + w;
    if (parent) {
      const s = BZ.ballSpan(parent.x, parent.y, parent.d, parent.fuzz, y0 + i);
      if (!s) continue;
      a = Math.max(a, s[0] + (parent.inset || 0)); b = Math.min(b, s[1] - (parent.inset || 0));
    }
    if (b > a) ctx.fillRect(a, y0 + i, b - a, 1);
  }
};

// Tapered line between two balls: thickness at each end = radius*256/300
// (read_out), scaled per line (ours). Scanline fill + 1px edge pixels.
BZ.drawLine = function (ctx, x1, y1, t1, x2, y2, t2, color, outline, fuzz) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  if (len < 0.5) return;
  const nx = -dy / len, ny = dx / len;
  const P = [
    [x1 + nx * t1 / 2, y1 + ny * t1 / 2], [x2 + nx * t2 / 2, y2 + ny * t2 / 2],
    [x2 - nx * t2 / 2, y2 - ny * t2 / 2], [x1 - nx * t1 / 2, y1 - ny * t1 / 2],
  ];
  let ymin = Infinity, ymax = -Infinity;
  for (const p of P) { ymin = Math.min(ymin, p[1]); ymax = Math.max(ymax, p[1]); }
  ymin = Math.floor(ymin); ymax = Math.ceil(ymax);
  const fr = BZ.circle(Math.min(200, Math.max(1, ymax - ymin + 1))).fuzz[Math.max(0, Math.min(7, fuzz | 0))];
  const rows = [];
  for (let y = ymin; y <= ymax; y++) {
    const sy = y + 0.5; let a = Infinity, b = -Infinity;
    for (let k = 0; k < 4; k++) {
      const p = P[k], q = P[(k + 1) % 4];
      if ((p[1] <= sy && q[1] > sy) || (q[1] <= sy && p[1] > sy)) {
        const x = p[0] + (sy - p[1]) / (q[1] - p[1]) * (q[0] - p[0]);
        a = Math.min(a, x); b = Math.max(b, x);
      }
    }
    if (a === Infinity) continue;
    const f = fr[(y - ymin) % fr.length] || 0;
    let ia = Math.round(a) + f, ib = Math.round(b) + f;
    if (ib - ia < 1) ib = ia + 1;
    rows.push([ia, y, ib - ia]);
  }
  ctx.fillStyle = color;
  for (const r of rows) ctx.fillRect(r[0], r[1], r[2], 1);
  if (outline) {
    ctx.fillStyle = outline;
    for (const r of rows) { ctx.fillRect(r[0], r[1], 1, 1); if (r[2] > 1) ctx.fillRect(r[0] + r[2] - 1, r[1], 1, 1); }
  }
};

// 1px line (whiskers)
BZ.drawThin = function (ctx, x1, y1, x2, y2, color) {
  x1 = Math.round(x1); y1 = Math.round(y1); x2 = Math.round(x2); y2 = Math.round(y2);
  const dx = Math.abs(x2 - x1), dy = -Math.abs(y2 - y1), sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1;
  let err = dx + dy; ctx.fillStyle = color;
  for (let n = 0; n < 200; n++) {
    ctx.fillRect(x1, y1, 1, 1);
    if (x1 === x2 && y1 === y2) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x1 += sx; }
    if (e2 <= dx) { err += dx; y1 += sy; }
  }
};

// Eye: ball, then iris eased toward look target and clamped inside the eye
// (read_out), slit pupil (ours), catchlight (ours), eyelid as cut circle.
BZ.drawEye = function (ctx, e) {
  const { x, y, d, white, rim, iris, pupil, ix, iy, irisD, pupilW, lid, lidColor, lidLine } = e;
  BZ.drawBall(ctx, x, y, d, white, rim, null, 1, 0);
  const parent = { x, y, d, fuzz: 0, inset: 1 };
  if (lid < 0.98) {
    BZ.drawClipped(ctx, x + ix, y + iy, irisD, iris, parent, 0);
    if (irisD > 4) {
      // slit pupil: narrow vertical ellipse
      const ph = Math.max(2, Math.round(irisD - 2)), pw = Math.max(1, Math.round(pupilW));
      const px0 = Math.round(x + ix - pw / 2), py0 = Math.round(y + iy - ph / 2);
      ctx.fillStyle = pupil;
      for (let i = 0; i < ph; i++) {
        const k = (2 * i + 1 - ph) / ph, w = Math.max(1, Math.round(pw * Math.sqrt(1 - k * k)));
        const a = px0 + Math.round((pw - w) / 2), yy = py0 + i;
        const s = BZ.ballSpan(x, y, d, 0, yy); if (!s) continue;
        const aa = Math.max(a, s[0] + 1), bb = Math.min(a + w, s[1] - 1);
        if (bb > aa) ctx.fillRect(aa, yy, bb - aa, 1);
      }
      ctx.fillStyle = '#ffffff';
      const hx = Math.round(x + ix - irisD / 4), hy = Math.round(y + iy - irisD / 4);
      if (BZ.ballSpan(x, y, d, 0, hy)) ctx.fillRect(hx, hy, 1, 1);
    }
  }
  if (lid > 0.02) {
    const d0 = Math.round(d), y0 = Math.round(y - d0 / 2), rows = Math.round(lid * d0);
    ctx.fillStyle = lidColor;
    for (let i = 0; i < rows; i++) {
      const s = BZ.ballSpan(x, y, d0, 0, y0 + i); if (s) ctx.fillRect(s[0], y0 + i, s[1] - s[0], 1);
    }
    const s = BZ.ballSpan(x, y, d0, 0, y0 + rows);
    if (s && rows < d0) { ctx.fillStyle = lidLine; ctx.fillRect(s[0], y0 + rows, s[1] - s[0], 1); }
  }
};

// ── shared fills (ours) ──
BZ.ellipse = function (ctx, cx, cy, rx, ry, color) {
  ctx.fillStyle = color; const h = Math.max(1, Math.round(ry * 2)), y0 = Math.round(cy - ry);
  for (let i = 0; i < h; i++) { const k = (2 * i + 1 - h) / h, w = Math.round(rx * 2 * Math.sqrt(Math.max(0, 1 - k * k))); if (w > 0) ctx.fillRect(Math.round(cx - w / 2), y0 + i, w, 1); }
};
BZ.ballSpanE = function (cx, cy, rx, ry, y) {
  const k = (y + 0.5 - cy) / ry; if (Math.abs(k) >= 1) return null;
  const hw = rx * Math.sqrt(1 - k * k); return [Math.round(cx - hw), Math.round(cx + hw)];
};
BZ.fillPoly = function (ctx, pts, color) {
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  ctx.fillStyle = color;
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
    const sy = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) xs.push(a[0] + ((sy - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
    }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) { const a = Math.round(xs[k]), b = Math.round(xs[k + 1]); if (b > a) ctx.fillRect(a, y, b - a, 1); }
  }
};
BZ.ellRing = function (ctx, cx, cy, rx, ry, col) {
  let px = null, py = null;
  for (let i = 0; i <= 48; i++) { const a = (i / 48) * Math.PI * 2, x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry; if (px !== null) BZ.drawThin(ctx, px, py, x, y, col); px = x; py = y; }
};
BZ.leafPts = function (x, y, len, wid, ang, notch) {
  const top = [], bot = [], c = Math.cos(ang), s = Math.sin(ang), n = 14;
  for (let i = 0; i <= n; i++) {
    const t = i / n; let w = wid * Math.pow(Math.sin(Math.PI * t), 0.75);
    if (notch && t < 0.18) w *= t / 0.18;
    top.push([t * len, -w]); bot.push([t * len, w]);
  }
  return top.concat(bot.reverse()).map(([u, v]) => [x + u * c - v * s, y + u * s + v * c]);
};
BZ.leaf = function (ctx, x, y, len, wid, ang, col, rib, notch) {
  BZ.fillPoly(ctx, BZ.leafPts(x, y, len, wid, ang, notch), col);
  if (rib) BZ.drawThin(ctx, x, y, x + Math.cos(ang) * len * 0.9, y + Math.sin(ang) * len * 0.9, rib);
};

  function ik(A, T, l1, l2, s) {
    const dx = T[0] - A[0], dy = T[1] - A[1];

    const fake = { size: k, items: [], stage: { x: -999, y: -999, w: 9999, h: 9999 }, floorTop: -999, sound: { purr() {}, meow() {} }, pointer: {} };
    const c = new BZ.Cat({ coat: coatKey, x: W / 2 - 2 * k, y: H + (opts.full ? -3 : 20) * k, theta: Math.PI / 2 + 0.38 }, fake);
    c.state = 'show'; c.anim = 'sit'; c.pose = BZ.clonePose(BZ.POSES.sit);
    if (opts.lid != null) c.pose.lid = opts.lid;
    for (let i = 0; i < 40; i++) { c.t++; c.animate(); if (opts.lid != null) c.pose.lid = opts.lid; }
    // centre the head (ears included) in the frame
    const hp = BZ.project(BZ.camera(c.theta), c.skel.pos[BZ.IDX.head], c.petScale, c.x, c.y);
    c.x += W / 2 - hp[0]; c.y += H * (opts.headY || 0.6) - hp[1];
    c.blink = 0; BZ.drawCat(ctx, c);
  };

  BZ.Panel = function (root, api) {
    if (!document.getElementById('bo-panel-css')) {
      const st = document.createElement('style'); st.id = 'bo-panel-css';
      st.textContent = CSS.replace('${FONT}', BZ.FONT_URI || ''); document.head.appendChild(st);
    }
    const el = document.createElement('div'); el.className = 'bo-panel'; el.setAttribute('data-ui', '');
    el.innerHTML = `
      <div class="bo-head">
        <canvas class="bo-portrait" width="64" height="64" aria-hidden="true"></canvas>
        <div>
          <div class="bo-title"><span class="bo-name bo-pix">Bo</span><button class="bo-btn small bo-home" hidden>Send home</button><span class="bo-brand bo-pix">Desktop Bo</span></div>
          <div class="bo-mood">indifferent</div>
          <div class="bo-meters">
            <span>Belly</span><div class="bo-meter" data-k="belly"></div>
            <span>Energy</span><div class="bo-meter" data-k="energy"></div>
            <span>Love</span><div class="bo-meter" data-k="love"></div>
          </div>
        </div>
      </div>
      <div class="bo-sec bo-where" hidden>
        <h3 class="bo-pix">Where she lives</h3>
        <div class="bo-seg" role="group" aria-label="Where she lives">
          <button data-mode="habitat" data-scene="room" aria-pressed="true">Bo's Jungle</button><button data-mode="habitat" data-scene="yard" aria-pressed="false">Backyard</button><button data-mode="roam" aria-pressed="false">My desktop</button>
        </div>
      </div>
      <div class="bo-sec">
        <h3 class="bo-pix"><span>Put out</span><button class="bo-btn small bo-away">Tidy up</button></h3>
        <div class="bo-tabs" role="tablist"></div>
        <div class="bo-grid" role="tabpanel"></div>
        <div class="bo-hint">Pick something, then click where it goes. Drag things to move them.</div>
      </div>
      <div class="bo-sec">
        <h3 class="bo-pix"><span>Rexes</span><button class="bo-btn small primary bo-call">Call</button></h3>
        <div class="bo-cats"></div>
        <div class="bo-adopt"></div>
      </div>
      <div class="bo-foot">
        <span class="bo-row"><span>Size</span><span class="bo-size"><button data-s="1">S</button><button data-s="1.2">M</button><button data-s="1.5">L</button></span></span>
        <label class="bo-check"><input type="checkbox" class="bo-sound"> Sound</label>
        <span class="bo-extras bo-row"></span>
      </div>`;
    root.appendChild(el);
    const $ = (s) => el.querySelector(s);
    const meters = {};
    for (const m of el.querySelectorAll('.bo-meter')) { m.innerHTML = '<i></i>'.repeat(10); meters[m.dataset.k] = m; }
    // item tiles
    const grid = $('.bo-grid'), tiles = {}, tabs = $('.bo-tabs');
    let tab = 0; try { tab = +(localStorage.getItem('bo-tab') || 0) || 0; } catch (e) {}
    const groups = BZ.ITEM_GROUPS || [['All', BZ.ITEM_ORDER]];
    let place = 'room'; const here = (t) => { const pl = BZ.ITEMS[t] && BZ.ITEMS[t].places; return !pl || pl.includes(place); }; // some things only make sense in some places
    const showTab = (n) => { if (groups[n] && groups[n][2] && groups[n][2] !== place) n = 0; tab = n; try { localStorage.setItem('bo-tab', String(n)); } catch (e) {} for (const [t, el] of Object.entries(tiles)) el.hidden = !groups[n][1].includes(t) || !here(t); for (const b of tabs.children) { b.setAttribute('aria-selected', String(+b.dataset.n === n)); b.hidden = !!(groups[+b.dataset.n][2] && groups[+b.dataset.n][2] !== place); } };
    groups.forEach(([name], n) => { const b = document.createElement('button'); b.textContent = name; b.dataset.n = n; b.setAttribute('role', 'tab'); b.onclick = () => showTab(n); tabs.appendChild(b); });
    for (const type of BZ.ITEM_ORDER) {
      const d = BZ.ITEMS[type];
      const b = document.createElement('button'); b.className = 'bo-tile'; b.title = d.label + ' · ' + d.hint;
      b.innerHTML = `<canvas width="32" height="22"></canvas><span>${d.label}</span><i class="x" role="button" aria-label="Put away ${d.label}">×</i>`;
      BZ.drawIcon(b.querySelector('canvas'), type);
      b.addEventListener('click', (e) => {
        if (e.target.classList.contains('x')) { api.cmd('remove', type); refresh(); return; }
        api.cmd('carry', type); if (api.onPlace) api.onPlace(type); refresh();
      });
      grid.appendChild(b); tiles[type] = b;
    }
    showTab(Math.min(tab, groups.length - 1));
    $('.bo-home').onclick = () => { if (selected) { api.cmd('sendHome', selected); selected = null; catKey = ''; setTimeout(refresh, 50); } };
    $('.bo-away').onclick = () => { api.cmd('away'); refresh(); };
    $('.bo-call').onclick = () => api.cmd('call');
    for (const b of el.querySelectorAll('.bo-seg button')) b.onclick = () => { if (b.dataset.scene) api.cmd('scene', b.dataset.scene); api.cmd('mode', b.dataset.mode); setTimeout(refresh, 50); };
    if (api.modes) $('.bo-where').hidden = false;
    for (const b of el.querySelectorAll('.bo-size button')) b.onclick = () => { api.cmd('size', +b.dataset.s); refresh(); };
    $('.bo-sound').onchange = (e) => { api.cmd('sound', e.target.checked); };
    const ex = $('.bo-extras');
    for (const x of api.extras || []) {
      if (x.checkbox) { const l = document.createElement('label'); l.className = 'bo-check'; l.innerHTML = `<input type="checkbox"> ${x.label}`; const i = l.querySelector('input'); i.checked = !!x.checked; i.onchange = () => api.cmd(x.cmd, i.checked); ex.appendChild(l); }
      else { const b = document.createElement('button'); b.className = 'bo-btn small'; b.textContent = x.label; b.onclick = () => api.cmd(x.cmd, x.arg); ex.appendChild(b); }
    }
    // adopt drawer
    const adopt = $('.bo-adopt');
    for (const k of Object.keys(BZ.COATS)) {
      const c = BZ.COATS[k], b = document.createElement('button');
      b.innerHTML = `<canvas width="56" height="56"></canvas>${c.label}<small>${c.note}</small>`;
      BZ.portrait(b.querySelector('canvas'), k, { scale: 1.25, headY: 0.62 });
      b.onclick = () => { api.cmd('adopt', { coat: k }); adopt.classList.remove('open'); setTimeout(refresh, 60); };
      b.dataset.coat = k;
      adopt.appendChild(b);
    }
    let selected = null, catKey = '', lastPortrait = '';
    function refresh() {
      const s = api.get(); if (!s) return;
      const cats = s.cats || [];
      if (!cats.find((c) => c.id === selected)) selected = cats[0] ? cats[0].id : null;
      const cur = cats.find((c) => c.id === selected);
      if (cur) {
        $('.bo-home').hidden = cur.coat === 'bo';
        $('.bo-name').textContent = cur.name; $('.bo-mood').textContent = cur.mood + (cur.coat === 'bo' ? '' : ' · ' + cur.coatLabel.toLowerCase() + ' rex');
        for (const k in meters) { const v = Math.round((cur.needs[k] || 0) / 10); [...meters[k].children].forEach((i, n) => i.classList.toggle('on', n < v)); }
        const pk = cur.coat + (/asleep|settling/.test(cur.mood) ? 'z' : '');
        if (pk !== lastPortrait) { lastPortrait = pk; BZ.portrait($('.bo-portrait'), cur.coat, { lid: pk.endsWith('z') ? 1 : null, scale: 1.45, headY: 0.62 }); }
      }
      for (const t in tiles) { tiles[t].classList.toggle('out', !!(s.placed && s.placed[t])); tiles[t].classList.toggle('carry', s.carrying === t); }
      const tl = s.tool || (s.placed && (s.placed.laser ? 'laser' : s.placed.brush ? 'brush' : s.placed.wand ? 'wand' : null)), TD = tl && BZ.ITEMS[tl];
      $('.bo-hint').innerHTML = s.carrying ? `Click where the <b>${BZ.ITEMS[s.carrying].label.toLowerCase()}</b> should go.` : tl === 'laser' ? 'Laser is on. Move your cursor; click Laser again to stop.' : tl === 'brush' ? 'Brush in hand. Move it over a cat to groom her; click Brush again to put it down.' : tl === 'wand' ? 'Feather wand out. Dangle and swing it; click it again to put it away.' : TD && TD.seed ? `<b>${TD.label}</b> seeds: click a bed or a grass patch to plant. Water them to speed them up.` : tl === 'can' ? 'Watering can: hold the mouse down over the beds. (The cats would rather you didn’t.)' : tl === 'trowel' ? 'Trowel: click a plant to dig it back up.' : place === 'yard' ? 'Out back: plant seeds from the Garden tab, or put things out. Small things can go on the shelves and steps.' : 'Pick something, then click where it goes. Small things can go on the sill, shelves and table.';
      for (const b of el.querySelectorAll('.bo-seg button')) b.setAttribute('aria-pressed', String(b.dataset.mode === s.mode && (s.mode === 'roam' || b.dataset.scene === (s.scene || 'room'))));
      const np = s.place || (s.mode === 'roam' ? 'desk' : s.scene || 'room'); if (np !== place) { place = np; showTab(tab); }
      for (const b of el.querySelectorAll('.bo-size button')) b.setAttribute('aria-pressed', String(Math.abs(+b.dataset.s - s.size) < 0.01));
      $('.bo-sound').checked = !!s.sound;
      const can = s.adoptable || [];
      for (const b of adopt.querySelectorAll('button')) b.hidden = !can.includes(b.dataset.coat);
      adopt.style.gridTemplateColumns = can.length === 1 ? '1fr' : '';
      const key = cats.map((c) => c.id + c.name).join('|') + selected;
      if (key !== catKey) {
        catKey = key; const box = $('.bo-cats'); box.innerHTML = '';
        for (const c of cats) {
          const b = document.createElement('button'); b.className = 'bo-chip'; b.setAttribute('aria-pressed', String(c.id === selected));
          b.innerHTML = `<canvas width="28" height="28"></canvas><span>${c.name}</span>` + (c.coat === 'bo' ? '' : `<i class="x" role="button" title="Send ${c.name} home" aria-label="Send ${c.name} home">×</i>`);
          BZ.portrait(b.querySelector('canvas'), c.coat, { scale: 0.85, headY: 0.66 });
          b.onclick = (e) => { if (e.target.classList.contains('x')) { api.cmd('sendHome', c.id); if (selected === c.id) selected = null; catKey = ''; setTimeout(refresh, 50); return; } selected = c.id; lastPortrait = ''; catKey = ''; refresh(); };
          box.appendChild(b);
        }
        const add = document.createElement('button'); add.className = 'bo-chip add'; add.textContent = '+ Adopt a rex';
        add.onclick = () => adopt.classList.toggle('open'); box.appendChild(add);
      }
    }
    refresh();
    return { refresh, el };
  };
})();

</script>
<script>
  const world = new BZ.World(document.getElementById('c'), document.getElementById('o'), {});
  const hab = document.getElementById('hab'), stageEl = document.getElementById('stage');
  function setMode(m) {
    hab.hidden = m !== 'habitat';
    world.setHabitat(m === 'habitat', m === 'habitat' ? () => { const r = stageEl.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; } : null);
  }
  setMode('habitat');
  let saved = null; try { saved = JSON.parse(localStorage.getItem('desktop-bo-v2') || 'null'); } catch (e) {}
  world.load(saved);
  world.host.save = (d) => { try { localStorage.setItem('desktop-bo-v2', JSON.stringify(d)); } catch (e) {} };
  const panel = BZ.Panel(document.getElementById('dock'), {
    get: () => world.summary(), modes: true,
    cmd: (n, a) => { if (n === 'mode') setMode(a); else world.cmd(n, a); },
  });
  world.host.onChange = () => panel.refresh();
</script>
